name: Renderer CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build
      - run: npm run benchmark:assert
      - run: npm run test:browser
      - name: Upload renderer browser artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: renderer-browser-artifacts
          path: output/playwright/renderer/
          if-no-files-found: warn
